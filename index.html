.w{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative}

.btn{margin-top:14px;padding:15px 24px;border:0;border-bottom:6px solid var(--yd);border-radius:20px;background:var(--y);color:var(--ink);font:inherit;font-weight:800;font-size:1.08rem;width:100%}.btn:active{transform:translateY(4px);border-bottom-width:2px}

.reels{display:flex}
